<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Aggregator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5rem;
        }

        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        select, input, button {
            padding: 12px 20px;
            border-radius: 8px;
            border: 2px solid #e0e0e0;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            min-width: 120px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .translation-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 15px;
            margin-top: 20px;
            display: none;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #ff6b6b;
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }

        .error.active {
            display: block;
        }

        .news-container {
            display: grid;
            gap: 20px;
            margin-top: 30px;
        }

        .news-item {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .news-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .news-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .news-title {
            color: #333;
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .news-meta {
            display: flex;
            gap: 15px;
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 15px;
        }

        .news-source {
            background: #f0f0f0;
            padding: 4px 10px;
            border-radius: 5px;
            font-weight: 500;
        }

        .news-date {
            color: #999;
        }

        .sentiment {
            padding: 4px 10px;
            border-radius: 5px;
            font-weight: 500;
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        .sentiment.positive {
            background: #d4edda;
            color: #155724;
        }

        .sentiment.negative {
            background: #f8d7da;
            color: #721c24;
        }

        .sentiment.neutral {
            background: #e2e3e5;
            color: #383d41;
        }

        .news-summary {
            color: #555;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .news-translated {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            border-left: 4px solid #667eea;
        }

        .news-translated h4 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .news-link {
            display: inline-block;
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            margin-top: 10px;
            transition: color 0.3s ease;
        }

        .news-link:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        .stats {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            text-align: center;
            font-size: 1.1rem;
            color: #666;
        }

        .stats strong {
            color: #667eea;
            font-size: 1.3rem;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .translation-controls {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📰 News Aggregator</h1>
            <div class="controls">
                <select id="category">
                    <option value="technology">Technology</option>
                    <option value="business">Business</option>
                    <option value="sports">Sports</option>
                    <option value="entertainment">Entertainment</option>
                    <option value="health">Health</option>
                    <option value="science">Science</option>
                    <option value="world">World</option>
                </select>
                
                <input type="date" id="date" value="">
                
                <div class="translation-controls">
                    <label style="display: flex; align-items: center; gap: 5px;">
                        <input type="checkbox" id="translateCheck" style="width: auto; margin: 0;">
                        <span>Translate</span>
                    </label>
                    <select id="language" disabled>
                        <option value="hi">Hindi</option>
                        <option value="mr">Marathi</option>
                    </select>
                </div>
                
                <button onclick="fetchNews()">Get News</button>
            </div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Fetching news articles...</p>
            <p style="font-size: 0.9rem; color: #999; margin-top: 10px;">This may take a moment as we extract and summarize content</p>
        </div>

        <div class="error" id="error"></div>
        
        <div class="stats" id="stats" style="display: none;"></div>
        
        <div class="news-container" id="newsContainer"></div>
    </div>

    <script>
        // Set today's date as default
        document.getElementById('date').value = new Date().toISOString().split('T')[0];

        // Enable/disable language selector
        document.getElementById('translateCheck').addEventListener('change', function() {
            document.getElementById('language').disabled = !this.checked;
        });

        async function fetchNews() {
            const category = document.getElementById('category').value;
            const date = document.getElementById('date').value;
            const translate = document.getElementById('translateCheck').checked;
            const language = document.getElementById('language').value;
            
            const loadingEl = document.getElementById('loading');
            const errorEl = document.getElementById('error');
            const containerEl = document.getElementById('newsContainer');
            const statsEl = document.getElementById('stats');
            
            // Show loading, hide others
            loadingEl.classList.add('active');
            errorEl.classList.remove('active');
            containerEl.innerHTML = '';
            statsEl.style.display = 'none';
            
            try {
                const response = await fetch('/get_news', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        category: category,
                        date: date,
                        translation: translate,
                        translation_language: language
                    })
                });
                
                const data = await response.json();
                
                loadingEl.classList.remove('active');
                
                if (data.error) {
                    errorEl.innerHTML = `
                        <strong>Error:</strong> ${data.error}
                        ${data.suggestion ? `<br><br>${data.suggestion}` : ''}
                    `;
                    errorEl.classList.add('active');
                    return;
                }
                
                if (!data.news || data.news.length === 0) {
                    errorEl.innerHTML = 'No news articles found for the selected criteria. Try a different date or category.';
                    errorEl.classList.add('active');
                    return;
                }
                
                // Show stats
                statsEl.innerHTML = `Found <strong>${data.count || data.news.length}</strong> news articles`;
                statsEl.style.display = 'block';
                
                // Display news items
                data.news.forEach(item => {
                    const newsItem = document.createElement('div');
                    newsItem.className = 'news-item';
                    
                    newsItem.innerHTML = `
                        <h2 class="news-title">${item.title}</h2>
                        <div class="news-meta">
                            <span class="news-source">${item.source}</span>
                            <span class="news-date">${item.published_date || 'Date not available'}</span>
                            <span class="sentiment ${item.sentiment}">${item.sentiment}</span>
                        </div>
                        <div class="news-summary">${item.summary}</div>
                        ${item.translated_summary ? `
                            <div class="news-translated">
                                <h4>Translation (${item.translation_language === 'hi' ? 'Hindi' : 'Marathi'})</h4>
                                <p>${item.translated_summary}</p>
                            </div>
                        ` : ''}
                        <a href="${item.url}" target="_blank" class="news-link">Read Full Article →</a>
                    `;
                    
                    containerEl.appendChild(newsItem);
                });
                
            } catch (error) {
                loadingEl.classList.remove('active');
                errorEl.innerHTML = `Failed to fetch news: ${error.message}`;
                errorEl.classList.add('active');
                console.error('Error:', error);
            }
        }

        // Fetch news on page load
        window.addEventListener('load', () => {
            fetchNews();
        });
    </script>
</body>
</html>
